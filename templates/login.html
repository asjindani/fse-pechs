{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block card %}

    <h2>Login</h2>
    <form method="POST">
        <label for="email">Email Address</label>
        <input type="email" name="email" required>
        <label for="password">Password</label>
        <input type="password" name="pass" required>
        <button type="submit">Login</button>
    </form>

{% endblock %}
